# =============================================================================
# CI 工作流 — 持续集成
#
# 触发条件：push / pull_request 到 main 或 dev_* 分支
# 流程：代码检查 → 单元测试 → 环境验证 → Docker 构建验证
# =============================================================================

name: CI

on:
  push:
    branches: [main, 'dev_*', 'feature/*']
    paths:
      - 'mcp-langgraph-agent/**'
  pull_request:
    branches: [main, 'dev_*']
    paths:
      - 'mcp-langgraph-agent/**'

# 同一分支的并发 CI 只保留最新一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mcp-langgraph-agent

jobs:
  # ── Job 1: 代码质量检查 ────────────────────────────────────────────
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: mcp-langgraph-agent/requirements.txt

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff 代码风格检查
        run: ruff check src/ tests/ scripts/

      - name: Mypy 类型检查
        run: mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # 类型检查暂不阻断 CI

  # ── Job 2: 单元测试 ─────────────────────────────────────────────────
  test:
    name: 单元测试 (Python 3.11 / 3.12 / 3.13)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
      fail-fast: false  # 单个版本失败不阻断其他版本
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: mcp-langgraph-agent/requirements.txt

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-html

      - name: 创建 .env 配置文件
        run: cp .env.example .env

      - name: 创建运行时目录
        run: mkdir -p logs reports screenshots data

      - name: 运行单元测试
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --junitxml=reports/test-results.xml \
            --html=reports/test-report.html \
            --self-contained-html

      - name: 生成测试报告摘要
        if: always()
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          import os
          xml_path = 'reports/test-results.xml'
          if os.path.exists(xml_path):
              tree = ET.parse(xml_path)
              root = tree.getroot()
              total = int(root.attrib.get('tests', 0))
              failures = int(root.attrib.get('failures', 0))
              errors = int(root.attrib.get('errors', 0))
              passed = total - failures - errors
              time_s = float(root.attrib.get('time', 0))
              with open('reports/summary.txt', 'w') as f:
                  f.write(f'总测试: {total} | 通过: {passed} | 失败: {failures} | 错误: {errors} | 耗时: {time_s:.1f}s\n')
          else:
              with open('reports/summary.txt', 'w') as f:
                  f.write('测试结果文件未生成\n')
          "

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: mcp-langgraph-agent/reports/
          retention-days: 7

      - name: 发布测试报告到 PR 评论
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'mcp-langgraph-agent/reports/summary.txt';
            let summary = '测试报告未生成';
            if (fs.existsSync(summaryPath)) {
              summary = fs.readFileSync(summaryPath, 'utf8');
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🧪 测试报告\n\`\`\`\n${summary}\n\`\`\``
            });

  # ── Job 3: 环境验证 ─────────────────────────────────────────────────
  verify:
    name: 环境验证
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: mcp-langgraph-agent/requirements.txt

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建 .env 配置文件
        run: cp .env.example .env

      - name: 创建运行时目录
        run: mkdir -p logs reports screenshots data

      - name: 运行环境验证
        run: python scripts/verify_env.py || true
        # CI 中 Appium/设备不可用，仅验证模块功能部分

      - name: 上传验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-verify-report
          path: mcp-langgraph-agent/reports/env_verify_*.json
          retention-days: 7

  # ── Job 4: Docker 构建验证 ──────────────────────────────────────────
  docker-build:
    name: Docker 构建验证
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: 构建 MCP Server 镜像
        run: docker build -f Dockerfile.mcp -t mcp-server:test .

      - name: 构建 LangGraph Agent 镜像
        run: docker build -f Dockerfile.langgraph -t langgraph-agent:test .

      - name: 检查 Docker Compose 配置
        run: docker compose config -f docker-compose.yml

  # ── Job 5: CI 通知 ────────────────────────────────────────────────
  notify:
    name: CI 结果通知
    runs-on: ubuntu-latest
    needs: [lint, test, verify, docker-build]
    if: always()
    steps:
      - name: 检查 CI 整体结果
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "verify: ${{ needs.verify.result }}"
          echo "docker-build: ${{ needs.docker-build.result }}"

      - name: 发送飞书通知（成功）
        if: needs.lint.result == 'success' && needs.test.result == 'success'
        run: |
          if [ -n "$FEISHU_WEBHOOK_URL" ]; then
            curl -s -X POST "$FEISHU_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"msg_type\":\"interactive\",\"card\":{\"header\":{\"title\":{\"tag\":\"plain_text\",\"content\":\"✅ CI 流水线通过\"},\"template\":\"green\"},\"elements\":[{\"tag\":\"markdown\",\"content\":\"**分支**: ${{ github.ref_name }}\\n**提交**: ${{ github.sha }}\\n**触发者**: ${{ github.actor }}\"}]}}"
          fi
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: 发送飞书通知（失败）
        if: needs.lint.result == 'failure' || needs.test.result == 'failure'
        run: |
          if [ -n "$FEISHU_WEBHOOK_URL" ]; then
            curl -s -X POST "$FEISHU_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"msg_type\":\"interactive\",\"card\":{\"header\":{\"title\":{\"tag\":\"plain_text\",\"content\":\"❌ CI 流水线失败\"},\"template\":\"red\"},\"elements\":[{\"tag\":\"markdown\",\"content\":\"**分支**: ${{ github.ref_name }}\\n**提交**: ${{ github.sha }}\\n**触发者**: ${{ github.actor }}\\n**详情**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}}"
          fi
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
