# =============================================================================
# CI 工作流 — 持续集成
#
# 触发条件：push / pull_request 到 main 或 dev_* 分支
# 流程：代码检查 → 单元测试 → 环境验证 → Docker 构建验证
# =============================================================================

name: CI

on:
  push:
    branches: [main, 'dev_*', 'feature/*']
    paths:
      - 'mcp-langgraph-agent/**'
  pull_request:
    branches: [main, 'dev_*']
    paths:
      - 'mcp-langgraph-agent/**'

# 同一分支的并发 CI 只保留最新一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mcp-langgraph-agent

jobs:
  # ── Job 1: 代码质量检查 ────────────────────────────────────────────
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: mcp-langgraph-agent/requirements.txt

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff 代码风格检查
        run: ruff check src/ tests/ scripts/

      - name: Mypy 类型检查
        run: mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # 类型检查暂不阻断 CI

  # ── Job 2: 单元测试 ─────────────────────────────────────────────────
  test:
    name: 单元测试 (Python 3.11 / 3.12 / 3.13)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
      fail-fast: false  # 单个版本失败不阻断其他版本
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: mcp-langgraph-agent/requirements.txt

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-html

      - name: 创建 .env 配置文件
        run: cp .env.example .env

      - name: 创建运行时目录
        run: mkdir -p logs reports screenshots data

      - name: 运行单元测试
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --junitxml=reports/test-results.xml

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: mcp-langgraph-agent/reports/
          retention-days: 7

  # ── Job 3: 环境验证 ─────────────────────────────────────────────────
  verify:
    name: 环境验证
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: mcp-langgraph-agent/requirements.txt

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建 .env 配置文件
        run: cp .env.example .env

      - name: 创建运行时目录
        run: mkdir -p logs reports screenshots data

      - name: 运行环境验证
        run: python scripts/verify_env.py || true
        # CI 中 Appium/设备不可用，仅验证模块功能部分

      - name: 上传验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-verify-report
          path: mcp-langgraph-agent/reports/env_verify_*.json
          retention-days: 7

  # ── Job 4: Docker 构建验证 ──────────────────────────────────────────
  docker-build:
    name: Docker 构建验证
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: 构建 MCP Server 镜像
        run: docker build -f Dockerfile.mcp -t mcp-server:test .

      - name: 构建 LangGraph Agent 镜像
        run: docker build -f Dockerfile.langgraph -t langgraph-agent:test .

      - name: 检查 Docker Compose 配置
        run: docker compose config -f docker-compose.yml
