# =============================================================================
# 发布工作流
#
# 在打 tag (v*) 时自动构建 Docker 镜像并推送到 GitHub Container Registry。
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: mcp-langgraph-agent

env:
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: 运行完整测试 ─────────────────────────────────────────────
  test-before-release:
    name: 发布前测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: mcp-langgraph-agent/requirements.txt

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建 .env 配置文件
        run: cp .env.example .env

      - name: 创建运行时目录
        run: mkdir -p logs reports screenshots data

      - name: 运行全部测试
        run: pytest tests/ -v

  # ── Job 2: 构建并推送 Docker 镜像 ───────────────────────────────────
  build-and-push:
    name: 构建发布镜像
    runs-on: ubuntu-latest
    needs: [test-before-release]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.mcp
            image: mcp-server
          - dockerfile: Dockerfile.langgraph
            image: langgraph-agent
          - dockerfile: Dockerfile.appium
            image: appium-server
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取版本号
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: mcp-langgraph-agent
          file: mcp-langgraph-agent/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
