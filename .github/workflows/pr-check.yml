# =============================================================================
# PR 检查工作流
#
# 在 Pull Request 上运行快速检查，确保代码质量。
# 仅运行 lint 和单版本测试以加快反馈速度。
# =============================================================================

name: PR Check

on:
  pull_request:
    branches: [main, 'dev_*']
    paths:
      - 'mcp-langgraph-agent/**'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mcp-langgraph-agent

jobs:
  pr-check:
    name: PR 快速检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: mcp-langgraph-agent/requirements.txt

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Ruff 代码风格检查
        run: ruff check src/ tests/ scripts/

      - name: 创建 .env 配置文件
        run: cp .env.example .env

      - name: 创建运行时目录
        run: mkdir -p logs reports screenshots data

      - name: 运行单元测试
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=50

      - name: 检查 MCP Server 工具注册
        run: python -c "
          from src.mobile_mcp.server import create_server
          server = create_server()
          tools = server.get_registered_tool_names()
          assert len(tools) >= 17, f'工具数不足: {len(tools)}'
          print(f'MCP Server 工具注册验证通过: {len(tools)} 个工具')
          "

      - name: 检查 LangGraph Workflow 构建
        run: python -c "
          from src.graph.workflow import build_workflow
          app = build_workflow()
          assert app is not None, '工作流构建失败'
          print('LangGraph Workflow 构建验证通过')
          "
