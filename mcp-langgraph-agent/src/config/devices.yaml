# 设备池配置文件
# 定义可用的移动端测试设备列表，每个设备包含平台、UDID、端口及 Capabilities。
# 对齐架构设计文档格式。Appium 处理 UI 交互，adb/idevice 处理系统级操作。

devices:
  # ── Android 设备 ──────────────────────────────────────────────
  - name: "Pixel_7_API_34"
    platform: "Android"
    udid: "emulator-5554"
    appium_port: 4723
    capabilities:
      automationName: "UiAutomator2"
      platformVersion: "14"
      appPackage: ""
      appActivity: ""
      noReset: true
      newCommandTimeout: 300

  # ── iOS 设备模版（取消注释并填入真实值即可使用） ──────────────
  # - name: "iPhone_15_Pro"
  #   platform: "iOS"
  #   udid: "00008101-000A1C1A3C08001E"   # 通过 Xcode -> Window -> Devices 获取
  #   appium_port: 4724                     # 多设备时使用不同端口
  #   capabilities:
  #     automationName: "XCUITest"
  #     platformVersion: "17.0"
  #     bundleId: ""                        # iOS App 的 Bundle ID
  #     noReset: true
  #     newCommandTimeout: 300
